<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP HTTP Test Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #111827;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .code-block {
      background: #020617;
      color: #f8fafc;
      padding: 1rem;
      border-radius: 0.5rem;
      white-space: pre-wrap;
      min-height: 240px;
      font-family: Consolas, monospace;
      font-size: 0.95rem;
    }
    .status-badge {
      font-size: 0.9rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }
    .btn-outline-light:hover {
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <div class="card rounded-4 p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h2 class="mb-1">ESP HTTP Test Dashboard</h2>
              <p class="text-muted mb-0">Send requests to your ESP device and inspect the JSON response.</p>
            </div>
            <span id="statusBadge" class="status-badge badge badge-secondary">Idle</span>
          </div>

          <div class="form-row">
            <div class="form-group col-md-7">
              <label for="deviceIp">Device IP</label>
              <input id="deviceIp" class="form-control" placeholder="e.g. 192.168.1.50" />
            </div>
            <div class="form-group col-md-5">
              <label for="method">Method</label>
              <select id="method" class="form-control">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="endpoint">Endpoint</label>
            <input id="endpoint" class="form-control" value="/api/ping" />
          </div>

          <div class="form-group">
            <label for="body">Request body</label>
            <textarea id="body" class="form-control" rows="5" placeholder='{"relay":1,"state":true}'></textarea>
          </div>

          <div class="d-flex flex-wrap gap-2 mb-3">
            <button id="sendBtn" class="btn btn-primary">Send request</button>
            <button id="pingBtn" class="btn btn-outline-light">Ping</button>
            <button id="dataBtn" class="btn btn-outline-light">Get data</button>
            <button id="relayOnBtn" class="btn btn-outline-success">Relay ON</button>
            <button id="relayOffBtn" class="btn btn-outline-warning">Relay OFF</button>
            <button id="rebootBtn" class="btn btn-outline-danger">Reboot</button>
          </div>

          <div class="mb-3">
            <h5 class="mb-2">Response</h5>
            <div id="responseBox" class="code-block">No request sent yet.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/http-test.js"></script>
</body>
</html>
